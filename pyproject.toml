[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atoo"
version = "0.2.4"
description = "Compile console conventions into a plan, apply it, prove it landed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
keywords = ["behringer", "wing", "mixing console", "live sound", "osc"]
# Read by PyPI only. The licence is not repeated here: `license` above is
# the one place, and the release checklist (docs/product/release-checklist.md)
# says how it changes with LICENSE.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
# Deliberately empty. Nothing in atoo/ imports a third-party package:
# every provider talks plain HTTP via urllib (FR-X.9), TOML is stdlib
# tomllib, and plan_schema.GENERATION_SCHEMA is an ordinary dict handed to
# the provider -- the schema is ENFORCED by the model's decoder, not
# validated locally. A venue laptop installs this and nothing else.
dependencies = []

# Shown in the sidebar of the PyPI page.
[project.urls]
Homepage = "https://github.com/corourke/Atoo"
Issues = "https://github.com/corourke/Atoo/issues"
Changelog = "https://github.com/corourke/Atoo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Everything the test suite imports, and nothing the tool needs. jsonschema
# checks that the schema we ship is itself well-formed and that real plans
# satisfy it; httpx2 is what FastAPI's TestClient is built on; playwright
# drives the browser tests, which skip without it; pyyaml parses the issue
# forms; setuptools is what the packaging tests build a wheel with, offline,
# and a venv made by Python 3.12 or newer no longer carries it. Playwright
# also needs a Chromium binary, which pip cannot install
# (`playwright install chromium` fetches one).
test = ["pytest", "jsonschema", "httpx2", "playwright", "pyyaml", "setuptools>=68"]
# The engine (compiler, apply, audit, watch) stays dependency-free (D9) --
# this extra is only for `atoo ui`, a browser client over that same
# engine. Install once from wherever this machine normally gets packages;
# nothing in atoo/webui.py reaches outside localhost afterward.
# `websockets` is required too, not just convenient: plain uvicorn ships
# no WebSocket implementation at all, and /ws/watch (the live alert feed)
# is the whole point of this UI -- without it every connection attempt
# fails with "No supported WebSocket library detected".
ui = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "websockets>=12,<16"]

[project.scripts]
# `a2` is the short spelling of `atoo` (the maintainer, 2026-10-13): the same
# entry point, so `a2 build` and `atoo build` are one command.
atoo = "atoo.cli:main"
a2 = "atoo.cli:main"

[tool.setuptools]
# The starter set -- the starter conventions, the starter preset library
# and the Demo show -- lives once, in the repository's top-level starter/
# and installs as the package `atoo.starter`, so
# `atoo init` and the UI's Try the demo show work from a pipx install
# with no checkout. `atoo.firstrun.starter_dir()` finds it in either
# place.
# Every module is in `atoo` itself; its other folders hold data only,
# listed under package-data below.
packages = ["atoo", "atoo.starter"]
package-dir = {"atoo.starter" = "starter"}

[tool.setuptools.package-data]
# Every non-.py file the package reads at runtime has to be listed here or
# it is simply absent from a wheel -- see tests/test_packaging.py, which
# fails both on a file that no glob matches and on a glob that matches no
# file ("domain/*.json" outlived the last .json in domain/).
# atoo.starter is `atoo init`'s starter set (never
# read from examples/ at runtime), the Demo show and the
# audit demo states `audit --help` and `watch --help` name.
atoo = ["prompts/*.md", "domain/*.md", "web/static/*", "web/demo_states/*.json",
             "initialized/*"]
"atoo.starter" = ["*.md", "presets/*", "demo-show/*", "audit-demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files import each other as `tests.<name>`; `tests/` has no
# `__init__.py`, so the repository root has to be on the path for a bare
# `pytest` (as CI runs it), not only for `python -m pytest`.
pythonpath = ["."]
#
# `live_model` marks the prompt-fidelity tests (in
# tests/test_prompt_fidelity.py), which call a REAL model and so cost real
# money and real minutes. They are the only way to ask whether a fact the
# conventions state survives into the plan, and whether one they do NOT
# state stays null instead of being guessed at -- no fake provider can
# answer either question -- so they exist, but they never run by
# accident: each skips unless ATOO_LIVE_MODEL_TESTS is set AND a
# provider is configured. Two independent switches on purpose, because
# someone may well have ATOO_AI_PROVIDER exported all the time for
# ordinary `atoo build` use, and `pytest` has to stay free for them.
# To run them:
#
#     ATOO_LIVE_MODEL_TESTS=1 ATOO_AI_PROVIDER=claude \
#         ATOO_AI_API_KEY=... python3 -m pytest -m live_model
#
markers = [
    "live_model: calls a real model and costs money; opt in with ATOO_LIVE_MODEL_TESTS=1",
]
